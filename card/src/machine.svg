    <text x="216" y="98" text-anchor="middle" class="screen-brand">JURA</text><text x="216" y="115" text-anchor="middle" id="jura-screen-status" class="screen-state">Ready</text>
    <text x="410" y="283" text-anchor="middle" class="graphic-label cooler">COOL CONTROL</text>
   </svg>