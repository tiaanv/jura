# Independent example for a Cool Control receiver. Use its existing wiring.
esphome:
  name: jura-coolcontrol-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/tiaanv/jura
      ref: milky
    refresh: 0s
    components: [jura_coolcontrol]

logger:
api:
wifi:
  ssid: "replace-with-your-network"
  password: "replace-with-your-password"

uart:
  id: cool_uart
  rx_pin: GPIO20
  baud_rate: 9600

jura_coolcontrol:
  uart_id: cool_uart
  level:
    name: "Jura Coolcontrol Level"
  temperature:
    name: "Jura Coolcontrol Temperature"
  raw_message:
    name: "Jura Coolcontrol Raw Message"
  message_counter:
    name: "Jura Coolcontrol Message Counter"
  status:
    name: "Jura Coolcontrol Status"
  online:
    name: "Jura Coolcontrol Online"
  communication_timeout: 10s
  measurement_timeout: 10s
  # Optional for older coolers that stay silent until receiving serial text.
  # Also configure uart.tx_pin using your actual TX wiring before enabling.
  # startup_probe:
  #   text: "\r\n"
  #   delay: 1s
  #   retry_interval: 2s
  #   max_attempts: 3

